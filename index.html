<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f3ed">
  <title>Everyday Calculator</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #20231f;
      --muted: #74786f;
      --paper: #f4f3ed;
      --panel: #fffefa;
      --line: #e8e7df;
      --green: #c7f06a;
      --green-ink: #24320d;
      --soft: #f0f0e9;
      --coral: #f08b72;
      font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--ink);
      background-color: var(--paper);
      background-image: radial-gradient(#d9d9ce 0.7px, transparent 0.7px);
      background-size: 18px 18px;
    }

    .calculator {
      width: min(100%, 390px);
      padding: 24px;
      border: 1px solid #e4e3db;
      border-radius: 12px;
      background: var(--panel);
      box-shadow: 0 18px 55px rgb(39 42 31 / 9%);
      animation: arrive 420ms ease-out both;
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 700;
    }

    .brand-mark {
      display: grid;
      width: 29px;
      height: 29px;
      place-items: center;
      border-radius: 8px;
      background: var(--green);
      font-size: 17px;
    }

    .keyboard-hint {
      color: var(--muted);
      font-size: 11px;
    }

    .display {
      min-height: 142px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      overflow: hidden;
      padding: 17px 3px 19px;
      border-bottom: 1px solid var(--line);
      text-align: right;
    }

    .expression {
      width: 100%;
      min-height: 26px;
      overflow-x: auto;
      color: var(--muted);
      font-size: 17px;
      white-space: nowrap;
      scrollbar-width: none;
    }

    .result {
      max-width: 100%;
      overflow-x: auto;
      font-size: clamp(38px, 12vw, 54px);
      font-weight: 600;
      line-height: 1.2;
      white-space: nowrap;
      scrollbar-width: none;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      padding-top: 17px;
    }

    button {
      min-width: 0;
      aspect-ratio: 1.16;
      border: 0;
      border-radius: 8px;
      color: var(--ink);
      background: var(--soft);
      font: inherit;
      font-size: 20px;
      cursor: pointer;
      transition: transform 120ms ease, background-color 120ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    button:hover { background: #e6e8dc; }
    button:active { transform: scale(.95); }
    button:focus-visible { outline: 3px solid #789b30; outline-offset: 2px; }
    button.utility { color: #4e5942; background: #e9ecdf; font-size: 17px; }
    button.operator { background: #f4e9d8; font-size: 23px; }
    button.equals { color: var(--green-ink); background: var(--green); font-size: 24px; }
    button.clear { color: #8b493c; background: #f8e8e2; font-size: 16px; font-weight: 700; }
    button.zero { grid-column: span 2; aspect-ratio: auto; }
    button.wide { grid-column: span 2; aspect-ratio: auto; }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(9px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 420px) {
      body { padding: 14px; }
      .calculator { padding: 19px; }
      .keys { gap: 8px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <header class="topline">
      <div class="brand"><span class="brand-mark" aria-hidden="true">+</span> Everyday Calculator</div>
      <span class="keyboard-hint">Keyboard ready</span>
    </header>
    <section class="display" aria-live="polite" aria-atomic="true">
      <div class="expression" id="expression" aria-label="Expression">&nbsp;</div>
      <output class="result" id="result" aria-label="Result">0</output>
    </section>
    <section class="keys" aria-label="Calculator keys">
      <button class="clear" data-action="clear" aria-label="Clear all">AC</button>
      <button class="utility" data-value="(" aria-label="Open parenthesis">(</button>
      <button class="utility" data-value=")" aria-label="Close parenthesis">)</button>
      <button class="operator" data-value="/" aria-label="Divide">÷</button>

      <button data-value="7">7</button>
      <button data-value="8">8</button>
      <button data-value="9">9</button>
      <button class="operator" data-value="*" aria-label="Multiply">×</button>

      <button data-value="4">4</button>
      <button data-value="5">5</button>
      <button data-value="6">6</button>
      <button class="operator" data-value="-" aria-label="Subtract">−</button>

      <button data-value="1">1</button>
      <button data-value="2">2</button>
      <button data-value="3">3</button>
      <button class="operator" data-value="+" aria-label="Add">+</button>

      <button class="utility" data-action="sign" aria-label="Change sign">+/−</button>
      <button class="zero" data-value="0">0</button>
      <button data-value=".">.</button>
      <button class="utility" data-value="%" aria-label="Percent">%</button>
      <button class="clear wide" data-action="backspace" aria-label="Delete last character">⌫</button>
      <button class="equals wide" data-action="equals" aria-label="Calculate">=</button>
    </section>
  </main>

  <script>
    const expressionDisplay = document.querySelector("#expression");
    const resultDisplay = document.querySelector("#result");
    let expression = "";
    let justCalculated = false;

    function calculate(source) {
      const tokens = source.match(/(?:\d+\.?\d*|\.\d+)|[()+\-*/%]/g) || [];
      if (tokens.join("") !== source.replace(/\s/g, "")) throw new Error("Invalid input");
      let position = 0;

      function parseExpression() {
        let value = parseTerm();
        while (tokens[position] === "+" || tokens[position] === "-") {
          const operator = tokens[position++];
          const right = parseTerm();
          value = operator === "+" ? value + right : value - right;
        }
        return value;
      }

      function parseTerm() {
        let value = parseUnary();
        while (["*", "/"].includes(tokens[position])) {
          const operator = tokens[position++];
          const right = parseUnary();
          if (operator === "/" && right === 0) throw new Error("Cannot divide by zero");
          value = operator === "*" ? value * right : value / right;
        }
        return value;
      }

      function parseUnary() {
        if (tokens[position] === "+") { position++; return parseUnary(); }
        if (tokens[position] === "-") { position++; return -parseUnary(); }
        return parsePostfix();
      }

      function parsePostfix() {
        let value;
        if (tokens[position] === "(") {
          position++;
          value = parseExpression();
          if (tokens[position++] !== ")") throw new Error("Missing parenthesis");
        } else {
          const token = tokens[position++];
          if (!token || !/^\d|^\./.test(token)) throw new Error("Expected a number");
          value = Number(token);
        }
        while (tokens[position] === "%") { position++; value /= 100; }
        return value;
      }

      if (!tokens.length) return 0;
      const value = parseExpression();
      if (position !== tokens.length || !Number.isFinite(value)) throw new Error("Invalid expression");
      return value;
    }

    function format(value) {
      if (Object.is(value, -0)) value = 0;
      return Number(value.toPrecision(12)).toString();
    }

    function render() {
      expressionDisplay.textContent = expression || "\u00a0";
      if (!expression) {
        resultDisplay.textContent = "0";
        return;
      }
      try {
        resultDisplay.textContent = format(calculate(expression));
      } catch {
        resultDisplay.textContent = "";
      }
    }

    function append(value) {
      if (justCalculated && /[\d.(]/.test(value)) expression = "";
      justCalculated = false;
      if (value === ".") {
        const lastNumber = expression.match(/(?:^|[+\-*/(])(-?(?:\d+\.?\d*|\.\d+))$/);
        if (lastNumber && lastNumber[1].includes(".")) return;
        if (!expression || /[+\-*/(]$/.test(expression)) expression += "0";
      }
      expression += value;
      render();
    }

    function press(action) {
      if (action === "clear") {
        expression = "";
        justCalculated = false;
      } else if (action === "backspace") {
        expression = expression.slice(0, -1);
        justCalculated = false;
      } else if (action === "sign") {
        const operand = expression.match(/(-?(?:\d+\.?\d*|\.\d+)%?)$/);
        if (operand) {
          const prefix = expression.slice(0, -operand[0].length);
          expression = prefix + (operand[0].startsWith("-") ? operand[0].slice(1) : `-${operand[0]}`);
        } else if (expression.endsWith(")")) {
          expression = `-(${expression})`;
        } else {
          expression += "-";
        }
        justCalculated = false;
      } else if (action === "equals") {
        try {
          const result = format(calculate(expression));
          expression = result;
          justCalculated = true;
        } catch {
          resultDisplay.textContent = "Error";
          return;
        }
      }
      render();
    }

    document.querySelector(".keys").addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;
      if (button.dataset.action) press(button.dataset.action);
      else append(button.dataset.value);
    });

    document.addEventListener("keydown", (event) => {
      if (/^[\d.+\-*/()%]$/.test(event.key)) {
        event.preventDefault();
        append(event.key);
      } else if (event.key === "Enter" || event.key === "=") {
        event.preventDefault();
        press("equals");
      } else if (event.key === "Backspace") {
        press("backspace");
      } else if (event.key === "Escape" || event.key === "Delete") {
        press("clear");
      }
    });
  </script>
</body>
</html>
